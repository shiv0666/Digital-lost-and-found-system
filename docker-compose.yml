services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lostfound
      POSTGRES_USER: lostfound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "5432:5432"
    volumes:
      - lostfound_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostfound -d lostfound"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lostfound_pgdata:
